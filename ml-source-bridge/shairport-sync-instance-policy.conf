<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  Override the shairport-sync packaged D-Bus policy.

  shairport-sync 4.3.x appends a per-process suffix (".i<pid>") to its D-Bus
  names for multi-instance safety, but the packaged policy in
  /usr/share/dbus-1/system.d/shairport-sync-{dbus,mpris}-policy.conf only
  allows the bare names. Result: shairport-sync logs
      "could not acquire ... org.gnome.ShairportSync.i<pid> on the system bus"
  on every start, and no D-Bus client can reach it.

  This file replaces those policies with a permissive `own_prefix` form that
  covers the suffixed names. Install at /etc/dbus-1/system.d/ which takes
  precedence over /usr/share. Reload via:
      sudo systemctl reload dbus
      sudo systemctl restart shairport-sync
-->
<busconfig>
  <policy user="shairport-sync">
    <allow own_prefix="org.gnome.ShairportSync"/>
    <allow own_prefix="org.mpris.MediaPlayer2.ShairportSync"/>
  </policy>
  <policy user="root">
    <allow own_prefix="org.gnome.ShairportSync"/>
    <allow own_prefix="org.mpris.MediaPlayer2.ShairportSync"/>
  </policy>
  <policy context="default">
    <allow send_destination_prefix="org.gnome.ShairportSync"/>
    <allow receive_sender="org.gnome.ShairportSync"/>
    <allow send_destination_prefix="org.mpris.MediaPlayer2.ShairportSync"/>
    <allow receive_sender="org.mpris.MediaPlayer2.ShairportSync"/>
  </policy>
</busconfig>
