# Trigger-Template-Sensor sensor.mdt_n_music: nimmt die Meldungen von
# ha-notifier auf dem Pi entgegen (welcher Provider auf N.MUSIC spielt,
# Titel/Interpret/Album). Gehört in configuration.yaml – die Oberfläche
# kann keine Trigger-Sensoren anlegen.
#
# secrets.yaml:
#   mdt_nmusic_webhook: mdt-nmusic-<langer-zufallswert>
# Dieselbe ID steht auf dem Pi in /etc/ml-source-bridge.toml unter
# [ha_notifier] url = "http://<ha>:8123/api/webhook/<id>".
#
# ha-notifier schickt nur die Quellen aus [ha_notifier] sources – dort
# sources = ["N.MUSIC"] setzen, damit z. B. ein Plattenspieler auf N.RADIO
# diesen Sensor nicht überschreibt.
#
# state: playing / paused / idle. Bei idle sind die Attribute leer.
# cover_url: Cover vom Pi (http://<pi>.local:8099/cover/…), leer wenn keins.
# Der Browser lädt es direkt vom Pi – funktioniert, solange HA per http im
# LAN geöffnet wird (bei https blockiert der Browser das als Mixed Content).
template:
  - trigger:
      - trigger: webhook
        webhook_id: !secret mdt_nmusic_webhook
        allowed_methods: [POST]
        local_only: true
    sensor:
      - name: MDT N.MUSIC
        unique_id: mdt_nmusic
        state: "{{ trigger.json.state | default('idle') }}"
        attributes:
          provider: "{{ trigger.json.provider | default('') }}"
          display: "{{ trigger.json.display | default('') }}"
          title: "{{ trigger.json.title | default('') }}"
          artist: "{{ trigger.json.artist | default('') }}"
          album: "{{ trigger.json.album | default('') }}"
          cover_url: "{{ trigger.json.cover_url | default('') }}"
