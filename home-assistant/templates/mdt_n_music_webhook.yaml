# Trigger template sensor sensor.mdt_n_music: receives what ha-notifier on
# the Pi reports (which provider plays on N.MUSIC, title/artist/album,
# cover). Goes into configuration.yaml -- the UI can't create trigger
# sensors. See docs/home-assistant.md.
#
# secrets.yaml:
#   mdt_nmusic_webhook: mdt-nmusic-<long-random-value>
# The same id is in the Pi's /etc/ml-source-bridge.toml:
#   [ha_notifier] url = "http://<ha>:8123/api/webhook/<id>"
#
# ha-notifier only sends the sources in [ha_notifier] sources -- set
# sources = ["N.MUSIC"] there, so e.g. a turntable on N.RADIO doesn't
# overwrite this sensor.
#
# state: playing / paused / idle; on idle the attributes are empty.
# cover_url: cover served by the Pi (http://<pi>.local:8099/cover/…), empty
# if none. The browser loads it straight from the Pi -- works while HA is
# opened over http in the LAN (https would block it as mixed content).
template:
  - trigger:
      - trigger: webhook
        webhook_id: !secret mdt_nmusic_webhook
        allowed_methods: [POST]
        local_only: true
    sensor:
      - name: MDT N.MUSIC
        unique_id: mdt_nmusic
        state: "{{ trigger.json.state | default('idle') }}"
        attributes:
          provider: "{{ trigger.json.provider | default('') }}"
          display: "{{ trigger.json.display | default('') }}"
          title: "{{ trigger.json.title | default('') }}"
          artist: "{{ trigger.json.artist | default('') }}"
          album: "{{ trigger.json.album | default('') }}"
          cover_url: "{{ trigger.json.cover_url | default('') }}"
