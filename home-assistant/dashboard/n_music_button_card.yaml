type: custom:button-card
entity: media_player.masterlink_bridge_ma
show_name: false
show_icon: false
show_state: false
tap_action:
  action: more-info
# Visible while anything plays on N.MUSIC -- MA or a stream straight to
# the Pi (AirPlay from an iPhone, ...), see sensor.n_music_quelle.
visibility:
  - condition: state
    entity: sensor.n_music_quelle
    state_not: –
# ext: true while the Pi (sensor.mdt_n_music) reports a provider other
# than Sendspin/MA playing. Title/artist/cover then come from the Pi, and
# the buttons are hidden (HA can't control those providers).
variables:
  ext: >
    [[[
      const m = states['sensor.mdt_n_music'];
      const prov = m?.attributes?.provider || '';
      return m?.state === 'playing' && prov !== '' && prov !== 'sendspin';
    ]]]
custom_fields:
  quelle: >
    [[[
      const q = states['sensor.n_music_quelle']?.state || '';
      const i = states['sensor.n_music_inhalt']?.state || '';
      return 'N.MUSIC · ' + ((i && i !== '–') ? `${q} · ${i}` : q);
    ]]]
  titel: >
    [[[
      return variables.ext
        ? states['sensor.mdt_n_music'].attributes.title || ''
        : entity.attributes.media_title || '';
    ]]]
  artist: >
    [[[
      return variables.ext
        ? states['sensor.mdt_n_music'].attributes.artist || ''
        : entity.attributes.media_artist || '';
    ]]]
  prev:
    card:
      type: custom:button-card
      entity: media_player.masterlink_bridge_ma
      icon: >
        [[[ return states['sensor.n_music_quelle']?.state === 'Internet Radio'
              ? 'mdi:chevron-left-circle-outline' : 'mdi:skip-previous'; ]]]
      show_name: false
      tap_action:
        action: perform-action
        perform_action: script.n_music_vor_zurueck
        data:
          richtung: zurueck
      styles:
        card:
          - background: none
          - box-shadow: none
          - border: none
          - padding: 4px
        icon:
          - color: white
          - width: 32px
  play:
    card:
      type: custom:button-card
      entity: media_player.masterlink_bridge_ma
      icon: >
        [[[ return entity.state === 'playing' ? 'mdi:pause' : 'mdi:play'; ]]]
      show_name: false
      tap_action:
        action: perform-action
        perform_action: media_player.media_play_pause
        target:
          entity_id: media_player.masterlink_bridge_ma
      styles:
        card:
          - background: none
          - box-shadow: none
          - border: none
          - padding: 4px
        icon:
          - color: white
          - width: 40px
  next:
    card:
      type: custom:button-card
      entity: media_player.masterlink_bridge_ma
      icon: >
        [[[ return states['sensor.n_music_quelle']?.state === 'Internet Radio'
              ? 'mdi:chevron-right-circle-outline' : 'mdi:skip-next'; ]]]
      show_name: false
      tap_action:
        action: perform-action
        perform_action: script.n_music_vor_zurueck
        data:
          richtung: vor
      styles:
        card:
          - background: none
          - box-shadow: none
          - border: none
          - padding: 4px
        icon:
          - color: white
          - width: 32px
styles:
  card:
    - height: 200px
    - padding: 16px
    - color: white
    - background: >
        [[[
          // Cover from MA or -- for AirPlay & co. -- straight from the Pi.
          const pic = variables.ext
            ? states['sensor.mdt_n_music'].attributes.cover_url
            : entity.attributes.entity_picture;
          const shade = 'linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.75))';
          return pic
            ? `${shade}, url("${pic}") center / cover no-repeat`
            : `${shade}, var(--primary-color)`;
        ]]]
  grid:
    - grid-template-areas: '"quelle quelle quelle" "titel titel titel" "artist artist artist" "prev play next"'
    - grid-template-columns: 1fr 1fr 1fr
    - grid-template-rows: auto 1fr auto auto
  custom_fields:
    quelle:
      - justify-self: start
      - font-size: 0.8em
      - text-transform: uppercase
      - letter-spacing: 0.05em
      - opacity: 0.85
    titel:
      - justify-self: start
      - align-self: end
      - text-align: left
      - font-size: 1.3em
      - font-weight: 600
    artist:
      - justify-self: start
      - text-align: left
      - opacity: 0.85
      - margin-bottom: 8px
    prev:
      - display: "[[[ return variables.ext ? 'none' : 'block'; ]]]"
    play:
      - display: "[[[ return variables.ext ? 'none' : 'block'; ]]]"
    next:
      - display: "[[[ return variables.ext ? 'none' : 'block'; ]]]"
