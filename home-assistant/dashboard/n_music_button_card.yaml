type: custom:button-card
entity: media_player.masterlink_bridge_ma
show_name: false
show_icon: false
show_state: false
tap_action:
  action: more-info
# One card for the whole system: shows the turntable while it plays, then
# another bus source the Pi recognizes (CD, A.MEM, ... -- [ml_listen]),
# otherwise N.MUSIC (MA or a stream straight to the Pi, e.g. AirPlay).
visibility:
  - condition: or
    conditions:
      - condition: state
        entity: sensor.n_music_quelle
        state_not: –
      - condition: state
        entity: sensor.mdt_phono
        state: playing
      - condition: state
        entity: sensor.mdt_ml_listen
        state: playing
variables:
  # --- settings ---
  # Background for the turntable while no track is recognized. A photo of
  # your own deck works too: put it into /config/www/mdt/ and use
  # /local/mdt/<file>, or any http(s) URL.
  phono_image: /local/mdt/turntable.svg
  # Label of the turntable source in the header (its display_name).
  phono_label: BG7000
  # Background for a bus source (CD, ...) until its track is recognized;
  # empty = theme colour.
  bus_image: ''
  # --- derived ---
  # phono: the turntable is the active source (sensor.mdt_phono playing).
  phono: >
    [[[ return states['sensor.mdt_phono']?.state === 'playing'; ]]]
  # phono_known: ... and music recognition has identified the track
  # (recognized results always carry an artist).
  phono_known: >
    [[[
      const p = states['sensor.mdt_phono'];
      return p?.state === 'playing' && !!p?.attributes?.artist;
    ]]]
  # bus: another bus source plays and the Pi listens along (sensor.mdt_ml_listen).
  bus: >
    [[[ return !variables.phono && states['sensor.mdt_ml_listen']?.state === 'playing'; ]]]
  # bus_known: ... and music recognition has identified the track.
  bus_known: >
    [[[
      const b = states['sensor.mdt_ml_listen'];
      return variables.bus && !!b?.attributes?.artist;
    ]]]
  # ext: N.MUSIC plays something other than Sendspin/MA (per the Pi).
  # Title/artist/cover then come from the Pi.
  ext: >
    [[[
      const m = states['sensor.mdt_n_music'];
      const prov = m?.attributes?.provider || '';
      return m?.state === 'playing' && prov !== '' && prov !== 'sendspin';
    ]]]
custom_fields:
  quelle: >
    [[[
      if (variables.phono) {
        const album = states['sensor.mdt_phono'].attributes.album || '';
        return variables.phono_label + (variables.phono_known && album ? ` · ${album}` : '');
      }
      if (variables.bus) {
        const a = states['sensor.mdt_ml_listen'].attributes;
        return [a.source, a.track ? `Titel ${a.track}` : '', variables.bus_known ? a.album : '']
          .filter(Boolean).join(' · ');
      }
      const q = states['sensor.n_music_quelle']?.state || '';
      const i = states['sensor.n_music_inhalt']?.state || '';
      return 'N.MUSIC · ' + ((i && i !== '–') ? `${q} · ${i}` : q);
    ]]]
  titel: >
    [[[
      if (variables.phono)
        return variables.phono_known
          ? states['sensor.mdt_phono'].attributes.title || ''
          : 'Schallplatte';
      if (variables.bus)
        return variables.bus_known
          ? states['sensor.mdt_ml_listen'].attributes.title || ''
          : states['sensor.mdt_ml_listen'].attributes.source || '';
      return variables.ext
        ? states['sensor.mdt_n_music'].attributes.title || ''
        : entity.attributes.media_title || '';
    ]]]
  artist: >
    [[[
      if (variables.phono)
        return variables.phono_known
          ? states['sensor.mdt_phono'].attributes.artist || ''
          : '';
      if (variables.bus)
        return variables.bus_known ? states['sensor.mdt_ml_listen'].attributes.artist || '' : '';
      return variables.ext
        ? states['sensor.mdt_n_music'].attributes.artist || ''
        : entity.attributes.media_artist || '';
    ]]]
  prev:
    card:
      type: custom:button-card
      entity: media_player.masterlink_bridge_ma
      icon: >
        [[[ return states['sensor.n_music_quelle']?.state === 'Internet Radio'
              ? 'mdi:chevron-left-circle-outline' : 'mdi:skip-previous'; ]]]
      show_name: false
      tap_action:
        action: perform-action
        perform_action: script.n_music_vor_zurueck
        data:
          richtung: zurueck
      styles:
        card:
          - background: none
          - box-shadow: none
          - border: none
          - padding: 4px
        icon:
          - color: white
          - width: 32px
  play:
    card:
      type: custom:button-card
      entity: media_player.masterlink_bridge_ma
      icon: >
        [[[ return entity.state === 'playing' ? 'mdi:pause' : 'mdi:play'; ]]]
      show_name: false
      tap_action:
        action: perform-action
        perform_action: media_player.media_play_pause
        target:
          entity_id: media_player.masterlink_bridge_ma
      styles:
        card:
          - background: none
          - box-shadow: none
          - border: none
          - padding: 4px
        icon:
          - color: white
          - width: 40px
  next:
    card:
      type: custom:button-card
      entity: media_player.masterlink_bridge_ma
      icon: >
        [[[ return states['sensor.n_music_quelle']?.state === 'Internet Radio'
              ? 'mdi:chevron-right-circle-outline' : 'mdi:skip-next'; ]]]
      show_name: false
      tap_action:
        action: perform-action
        perform_action: script.n_music_vor_zurueck
        data:
          richtung: vor
      styles:
        card:
          - background: none
          - box-shadow: none
          - border: none
          - padding: 4px
        icon:
          - color: white
          - width: 32px
styles:
  card:
    - height: 200px
    - padding: 16px
    - color: white
    - background: >
        [[[
          // Turntable: recognized cover, else the default image.
          // Bus source (CD, ...): recognized cover, else bus_image.
          // N.MUSIC: cover from MA or -- for AirPlay & co. -- from the Pi.
          const pic = variables.phono
            ? (variables.phono_known && states['sensor.mdt_phono'].attributes.cover_url)
                || variables.phono_image
            : variables.bus
              ? (variables.bus_known && states['sensor.mdt_ml_listen'].attributes.cover_url)
                  || variables.bus_image
            : variables.ext
              ? states['sensor.mdt_n_music'].attributes.cover_url
              : entity.attributes.entity_picture;
          const shade = 'linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.75))';
          return pic
            ? `${shade}, url("${pic}") center / cover no-repeat`
            : `${shade}, var(--primary-color)`;
        ]]]
  grid:
    - grid-template-areas: '"quelle quelle quelle" "titel titel titel" "artist artist artist" "prev play next"'
    - grid-template-columns: 1fr 1fr 1fr
    - grid-template-rows: auto 1fr auto auto
  custom_fields:
    quelle:
      - justify-self: start
      - font-size: 0.8em
      - text-transform: uppercase
      - letter-spacing: 0.05em
      - opacity: 0.85
    titel:
      - justify-self: start
      - align-self: end
      - text-align: left
      - font-size: 1.3em
      - font-weight: 600
    artist:
      - justify-self: start
      - text-align: left
      - opacity: 0.85
      - margin-bottom: 8px
    prev:
      - display: "[[[ return variables.ext || variables.phono || variables.bus ? 'none' : 'block'; ]]]"
    play:
      - display: "[[[ return variables.ext || variables.phono || variables.bus ? 'none' : 'block'; ]]]"
    next:
      - display: "[[[ return variables.ext || variables.phono || variables.bus ? 'none' : 'block'; ]]]"
